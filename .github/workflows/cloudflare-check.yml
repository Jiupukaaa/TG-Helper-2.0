name: Cloudflare Worker checks

on:
  push:
    branches:
      - feat/cloudflare
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install migration-tool dependencies
        run: npm ci --prefix tg-helper-migration --no-audit --no-fund
      - name: Test Neon export and D1 conversion (synthetic data)
        run: npm run test:local --prefix tg-helper-migration
      - name: Test PostgreSQL wire export and D1 conversion (synthetic data)
        run: npm run test:export --prefix tg-helper-migration
      - name: Install Worker dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply D1 migrations locally
        run: npm run db:migrate:local
      - name: Type-check Worker
        run: npm run typecheck
      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --outdir .worker-build
