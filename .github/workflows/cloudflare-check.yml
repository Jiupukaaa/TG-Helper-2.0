name: Cloudflare Worker checks

on:
  push:
    branches:
      - feat/cloudflare
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check Worker
        run: npm run typecheck
      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --outdir .worker-build
