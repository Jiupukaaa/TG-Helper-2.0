name: Trigger reminders check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: trigger-reminders
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron/reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET_URL: ${{ vars.TG_HELPER_URL }}
        run: |
          set -euo pipefail

          if [ -z "$TARGET_URL" ]; then
            echo "::error::Repository variable TG_HELPER_URL is not set"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set"
            exit 1
          fi

          RESPONSE=$(curl \
            --fail-with-body \
            --show-error \
            --silent \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 65 \
            --write-out '\nHTTP_STATUS=%{http_code}\n' \
            "${TARGET_URL%/}/api/cron/reminders")

          echo "$RESPONSE"
