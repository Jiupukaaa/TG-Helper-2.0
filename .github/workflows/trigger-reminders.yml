name: Trigger reminders check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: trigger-reminders
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET_URL: ${{ vars.TG_HELPER_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "::error::Repository variable TG_HELPER_URL is not set..."
            exit 1
          fi
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 65 \
            "${TARGET_URL%/}/api/cron/reminders"
